[package]
name = "blake2b-miner"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A DATUM BIP-110 Blake2b-256 Stratum miner for CPU, Metal, CUDA, and OpenCL"

[features]
default = []
cuda = []
opencl = ["dep:opencl3"]

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = "3.4"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
url = "2.5"
opencl3 = { version = "0.12.3", optional = true }

[target.'cfg(any(target_vendor = "apple", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
objc = "0.2"

[dev-dependencies]
blake2 = "0.10"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
